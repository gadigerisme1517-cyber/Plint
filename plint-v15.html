<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plint</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B4DD8'/%3E%3Cpath d='M14.2 6h4.6a8.6 8.6 0 0 1 0 17.2h-4.6V29H8.4v-8.4l5.8-5.8V6Z' fill='%23fff'/%3E%3Cpath d='M14.2 11.6V18h4.6a3.2 3.2 0 0 0 0-6.4h-4.6Z' fill='%231B4DD8'/%3E%3Crect x='5.4' y='11.6' width='6.4' height='6.4' rx='1.6' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#12213D">
<meta name="description" content="Plint. Work done on site, money moved at the bank.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   Three screens. One chain.
   A stage is verified on site with stamped photographs.
   That evidence goes to the buyer, to his lender, and to the
   brokerage ledger. Head office only sees where it is stuck.

   No summary tiles. No contracted-versus-billed. No board
   pack. Their ERP already does all of that.
   ========================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
:root{--ink:#12213D;--ink-2:#5B6B85;--ink-3:#93A1B8;--paper:#FFF;--hair:#DEE5EF;--hair-2:#F2F6FB;--brand:#1B4DD8;--brand-dk:#1540B8;--brand-soft:#EAF0FE;--hot:#DC2626;--hot-soft:#FEECEC;--warn:#B45309;--warn-soft:#FEF3E2;--ok:#0F7A4A;--ok-soft:#EAF6F0}
body{font-family:'Inter',system-ui,sans-serif;background:#0B1A33;color:#C6D3E6;
 display:flex;flex-direction:column;align-items:center;padding:18px 14px 50px;min-height:100vh}
.wrap{width:100%;max-width:1340px}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.bm{font-weight:600;font-size:15px;letter-spacing:-.3px;color:#FFF}
.blogo{display:inline-flex;align-items:center;margin-right:1px}
.sub{font-size:11.5px;color:#6E7679;margin-right:auto;margin-left:10px;font-weight:300}
.role{background:none;border:1px solid #24365A;color:#D3DEEE;border-radius:6px;padding:7px 14px;font:400 12.5px/1 'Inter';cursor:pointer}
.role[aria-pressed="true"]{background:#FFF;color:#12213D;border-color:#FFF}
.stagearea{display:flex;justify-content:center}
.phone{position:relative;width:100%;max-width:392px;height:min(830px,88vh);overflow:hidden;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;border-radius:26px}
/* Desktop rendering of the same views. Real classes: .blk .lede .top .item .nav */
.phone.wide{max-width:1160px;height:min(820px,88vh);border-radius:12px}
.phone.wide .sysbar{display:none}
.phone.wide .appbrand{padding:16px 48px 14px;font-size:15px;border-bottom:1px solid var(--hair)}
.phone.wide .top{padding:22px 48px 0;min-height:56px}
.phone.wide .lede{padding:0 48px;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap}
.phone.wide .lede .k{margin-bottom:0;flex:0 0 100%}
.phone.wide .lede .mega{font-size:76px;line-height:1}
.phone.wide .lede .cap{margin-top:0;flex:1;min-width:280px;max-width:60ch}
.phone.wide .blk{padding:0 48px}
.phone.wide .item{padding:19px 48px;gap:24px}
.phone.wide .item .mid{max-width:78ch}
.phone.wide .gap{height:30px}.phone.wide .gap.l{height:44px}
.phone.wide .nav{flex:0 0 60px;padding:0 34px}
.phone.wide .nav .dest{font-size:13.5px}
/* two columns for the long stacked lists, which is the actual desktop difference */
.phone.wide .scroll{column-gap:0}
.phone.wide .wide2{display:grid;grid-template-columns:1fr 1fr;gap:0 44px;padding:0 48px}
.phone.wide .wide2 .blk,.phone.wide .wide2 .item{padding-left:0;padding-right:0}
.fitbtn{background:none;border:1px solid #24365A;color:#D3DEEE;border-radius:6px;padding:7px 12px;font:400 12.5px/1 'Inter';cursor:pointer;margin-left:8px}
.fitbtn[aria-pressed="true"]{background:#FFF;color:#12213D;border-color:#FFF}
@media(max-width:900px){.phone.wide{max-width:392px}.phone.wide .wide2{grid-template-columns:1fr}}
.desk{width:100%;background:var(--hair-2);color:var(--ink);border-radius:12px;overflow:hidden;display:flex;min-height:min(760px,86vh)}
.sysbar{height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font:500 11.5px/1 'Inter';color:var(--ink-3)}
.scroll{flex:1;overflow-y:auto}.scroll::-webkit-scrollbar{width:0}
h1,h2,h3,h4,p{margin:0}
.mega{font-size:76px;line-height:72px;font-weight:300;letter-spacing:-3.4px;font-variant-numeric:tabular-nums}
.big{font-size:34px;line-height:40px;font-weight:300;letter-spacing:-1.4px;font-variant-numeric:tabular-nums}
.h1{font-size:20px;line-height:27px;font-weight:500;letter-spacing:-.35px}
.h2{font-size:15px;line-height:21px;font-weight:500;letter-spacing:-.1px}
.b{font-size:14px;line-height:22px;color:var(--ink-2)}
.s{font-size:12.5px;line-height:18px;color:var(--ink-3)}
.k{font-size:10.5px;line-height:14px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3)}
.n{font-variant-numeric:tabular-nums}.hot{color:var(--hot)}.ink{color:var(--ink)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
.anim{animation:in .34s cubic-bezier(.16,.84,.28,1)}
.wrow,.hocard,.packwrap>*,.jstep,.drow2{animation:rise .42s cubic-bezier(.16,.84,.28,1) backwards}
.wrow:nth-child(1),.hocard:nth-child(1),.jstep:nth-child(1),.drow2:nth-child(1){animation-delay:.02s}
.wrow:nth-child(2),.hocard:nth-child(2),.jstep:nth-child(2),.drow2:nth-child(2){animation-delay:.05s}
.wrow:nth-child(3),.hocard:nth-child(3),.jstep:nth-child(3),.drow2:nth-child(3){animation-delay:.08s}
.wrow:nth-child(4),.jstep:nth-child(4),.drow2:nth-child(4){animation-delay:.11s}
.wrow:nth-child(5),.jstep:nth-child(5),.drow2:nth-child(5){animation-delay:.14s}
.wrow:nth-child(6),.jstep:nth-child(6),.drow2:nth-child(6){animation-delay:.17s}
.wrow:nth-child(n+7),.jstep:nth-child(n+7),.drow2:nth-child(n+7){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*,.anim,.wrow,.hocard,.jstep,.drow2{animation:none!important;transition:none!important}}
.st{cursor:pointer;transition:opacity .16s cubic-bezier(.2,.8,.3,1),transform .16s cubic-bezier(.2,.8,.3,1),background .16s}
.st:hover{opacity:.68}.st:active{transform:scale(.985)}
.wrow{transition:background .18s,padding .18s}
.wrow:hover{background:var(--hair-2)}
.hocard,.pickcard{transition:border-color .2s,box-shadow .2s,transform .2s}
.hocard:hover,.pickcard:hover{box-shadow:0 6px 22px rgba(16,18,21,.07);transform:translateY(-1px)}
.sbtn{transition:background .16s,color .16s}
.st:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
::selection{background:var(--ink);color:var(--paper)}
.top{padding:10px 26px 0;display:flex;align-items:center;gap:14px;min-height:48px}
.top .g{flex:1}
.ib{width:40px;height:40px;margin:0 -10px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.blk{padding:0 26px}
.gap{height:36px}.gap.s{height:22px}.gap.l{height:54px}
.rule{height:1px;background:var(--hair);margin:0 26px}
.lede{padding:0 26px}.lede .k{margin-bottom:14px}.lede .cap{margin-top:12px}
.marks{display:flex;gap:5px;margin-top:26px}
.marks i{height:2px;flex:1;background:var(--hair)}
.marks i.on{background:var(--ink)}.marks i.due{background:var(--hot)}
.fig{margin-top:30px}
.fig .im{width:100%;display:block}
.fig figcaption{padding:10px 26px 0;display:flex;justify-content:space-between;align-items:baseline}
.stage{padding:22px 26px;border-bottom:1px solid var(--hair-2);display:flex;gap:20px;align-items:flex-start}
.stage:last-child{border-bottom:0}
.stage .idx{flex:0 0 22px;padding-top:2px}
.stage .body{flex:1;min-width:0}
.stage.wait h4,.stage.wait .amt{color:var(--ink-3)}
.stage .row{display:flex;align-items:baseline;gap:12px}
.stage .amt{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);white-space:nowrap}
.stage .amt.hot{color:var(--ink)}
.stage .meta{margin-top:3px}
.strip{display:flex;gap:6px;margin-top:14px;overflow-x:auto}.strip::-webkit-scrollbar{height:0}
.strip button{flex:0 0 148px;height:100px;border:0;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;position:relative;background:none}
.strip .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(16,18,21,.72));color:#fff;font:400 10px/13px 'Inter';font-variant-numeric:tabular-nums;text-align:left}
.line{display:flex;justify-content:space-between;align-items:baseline;padding:14px 26px;border-bottom:1px solid var(--hair-2)}
.line:last-of-type{border-bottom:0}
.line b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink)}
.line.sum{border-top:1px solid var(--hair);border-bottom:0;padding-top:18px}
.line.sum b{font-size:19px}
.line.hot b,.line.hot span{color:var(--ink)}
.item{display:flex;align-items:center;gap:18px;padding:17px 26px;width:100%;background:none;border:0;border-bottom:1px solid var(--hair-2);text-align:left;cursor:pointer;color:var(--ink);font-family:inherit}
.item:last-of-type{border-bottom:0}
.item .mid{flex:1;min-width:0}.item .mid p{margin-top:2px}
.item .end{color:var(--ink-3)}
.act{width:100%;height:50px;border:1px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--paper);font:500 14px/1 'Inter';cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:9px}
.act.line{background:none;color:var(--ink)}
.act:disabled{border-color:var(--hair);background:var(--hair);color:var(--ink-3);cursor:not-allowed}
.dock{flex:0 0 auto;padding:16px 26px 22px;border-top:1px solid var(--hair)}
.dock .s{text-align:center;margin-top:11px}
.nav{flex:0 0 58px;display:grid;border-top:1px solid var(--hair)}
.nav.four{grid-template-columns:repeat(4,1fr)}
.nav.five{grid-template-columns:repeat(5,1fr)}
.dest{background:none;border:0;cursor:pointer;color:var(--ink-3);font:500 11px/1 'Inter';position:relative;font-family:inherit}
.dest[aria-selected="true"]{color:var(--ink)}
.dest[aria-selected="true"]::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--ink)}
.tabs{display:flex;gap:26px;padding:6px 26px 0}
.tab{background:none;border:0;padding:10px 0;font:500 13px/1 'Inter';color:var(--ink-3);cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px;font-family:inherit}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ph{width:100%;aspect-ratio:4/3;border:1px solid var(--hair);border-radius:12px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-3);gap:10px;font-family:inherit}
.phg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.phg div,.phg button{aspect-ratio:1;overflow:hidden;border:1px solid var(--hair);border-radius:10px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-3)}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;border:0;border-bottom:1px solid var(--hair-2);background:none;padding:17px 0;color:var(--ink);font-family:inherit}
.opt .box{flex:0 0 18px;height:18px;border:1px solid var(--ink-3);border-radius:5px;display:grid;place-items:center}
.opt[aria-checked="true"] .box{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt .mid{flex:1}
.said{padding:18px 0 18px 22px;border-left:2px solid var(--ink);margin:26px 26px 0}
.said.hot{border-left-color:var(--hot)}.said.hot p{color:var(--ink)}
.fld{padding:0 26px;margin-top:26px}
.fld input,.fld textarea{width:100%;border:0;border-bottom:1px solid var(--hair);padding:10px 0;font:400 15px/22px 'Inter';color:var(--ink);resize:none;background:none;font-family:inherit}
.fld input:focus,.fld textarea:focus{outline:none;border-bottom-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
/* head office: a worklist, not a dashboard */
.side{flex:0 0 248px;padding:30px 0 26px;border-right:1px solid var(--hair);display:flex;flex-direction:column;background:var(--paper)}
.side .logo{padding:0 26px 28px;font:500 15px/1 'Inter'}
.side .grp{padding:18px 26px 6px}
.sbtn{display:flex;align-items:center;background:none;border:0;padding:11px 26px;font:400 13.5px/1 'Inter';color:var(--ink-2);cursor:pointer;text-align:left;width:100%;font-family:inherit}
.sbtn[aria-selected="true"]{color:var(--ink);font-weight:500}
.sbtn .c{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums}
.sbtn .c.h{color:var(--ink);font-weight:600}
.side .foot{margin-top:auto;padding:22px 26px 0;border-top:1px solid var(--hair)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--hair-2)}
.mhead{padding:30px 44px 0}.mhead .b{max-width:68ch}
.mbody{flex:1;overflow-y:auto;padding:0 44px 40px}.mbody::-webkit-scrollbar{width:0}
.clear{padding:104px 0;text-align:center;animation:in .4s cubic-bezier(.16,.84,.28,1)}
.emptyrow .ring,.clear .ring{width:52px;height:52px;margin:0 auto 22px;border-radius:50%;border:1.5px solid var(--hair);display:grid;place-items:center;color:var(--ok)}
.clear .big{color:var(--ink-3)}
.wl{margin-top:30px}
.wrow{display:flex;align-items:center;gap:24px;padding:22px 0;border-bottom:1px solid var(--hair-2)}
.wrow:first-child{border-top:1px solid var(--hair)}
.wrow .id{flex:0 0 58px;font:500 14px/1 'Inter';font-variant-numeric:tabular-nums}
.wrow .mid{flex:1;min-width:0}
.wrow .mid p{margin-top:3px}
.wrow .days{flex:0 0 84px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2)}
.wrow .days b{display:block;font:400 19px/24px 'Inter';color:var(--ink)}
.wrow .days b.h{color:var(--ink);font-weight:500}
.wrow .amt{flex:0 0 108px;text-align:right;font:400 15px/20px 'Inter';font-variant-numeric:tabular-nums}
.wbtn{border:1px solid var(--hair);border-radius:8px;background:none;padding:10px 16px;font:500 12.5px/1 'Inter';cursor:pointer;color:var(--ink);white-space:nowrap;font-family:inherit}
.wbtn:hover{border-color:var(--ink)}
.wbtn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wbtn:disabled{color:var(--ink-3);border-color:var(--hair-2);cursor:not-allowed}
.chk{width:20px;height:20px;border:1px solid var(--ink-3);border-radius:5px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--paper);flex:0 0 20px}
.chk[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.tools{display:flex;align-items:center;gap:14px;margin-top:26px}
.tools .g{flex:1}
.note{margin-top:30px;max-width:74ch}
.toast{position:absolute;left:26px;right:26px;bottom:74px;background:var(--ink);color:var(--paper);padding:14px 16px;font:400 12.5px/18px 'Inter';opacity:0;transform:translateY(8px);transition:.24s;pointer-events:none;border-radius:8px}
.toast.on{opacity:1;transform:none}
.dtoast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:28px;background:#101215;color:#fff;padding:14px 22px;font:400 13px/18px 'Inter';opacity:0;transition:.24s;pointer-events:none;z-index:99;border-radius:8px}
.dtoast.on{opacity:1;transform:translateX(-50%)}

.duebar{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border:1px solid var(--hair);border-radius:12px;background:var(--hair-2)}
.duebar .ddot{width:7px;height:7px;border-radius:50%;background:var(--hot);flex:0 0 auto}
.duebar .dtx{font-size:12.5px;line-height:17px;color:var(--ink-2)}
.duebar .dtx strong{color:var(--ink);font-weight:600}


.packwrap{padding:2px 2px 30px;max-width:840px}
.packhead{display:flex;align-items:flex-start;gap:20px}
.packhead .wbtn{flex:0 0 auto;margin-top:4px}
.doclist{border-top:1px solid var(--hair);margin-top:8px}
.docrow{display:flex;align-items:flex-start;gap:16px;padding:18px 4px;border-bottom:1px solid var(--hair)}
.docn{flex:0 0 auto;color:var(--ink-3);padding-top:2px}
.docbody{flex:1}
.docbody .s{margin-top:3px}
.doctag{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ok);font-weight:500;white-space:nowrap;padding-top:2px}

.jline{padding:0 26px}
.jstep{display:flex;align-items:flex-start;gap:14px;padding:16px 0;border-bottom:1px solid var(--hair);position:relative}
.jstep .jdot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--hair);display:grid;place-items:center;margin-top:2px;color:#fff}
.jstep.done .jdot{background:var(--ok);border-color:var(--ok)}
.jstep.now .jdot{border-color:var(--ink);border-width:2px}
.jstep.wait{opacity:.5}
.jstep .jbody{flex:1}
.jstep .jbody .s{margin-top:2px}
.jtag{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:2px 10px}
.jstep .jarrow{flex:0 0 auto;color:var(--ink-3);margin-top:4px}
.pickcard{display:block;width:100%;text-align:left;padding:18px;border:1px solid var(--hair);border-radius:16px;background:none;cursor:pointer;margin-bottom:0}
.pickcard .s{margin-top:6px}
.pickcard.on{border-color:var(--ink);border-width:2px;background:var(--hair-2)}
.wbtn.full{width:100%;justify-content:center}
.wbtn.off,.wbtn:disabled{opacity:.4;pointer-events:none}
.apphdr{display:flex;flex-direction:column;gap:2px;padding-bottom:2px;border-bottom:2px solid var(--ink)}
.doclist2{padding:0 26px}
.drow2{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:14px 0;cursor:pointer}
.drow2 .dchk{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--hair);display:grid;place-items:center;color:#fff}
.drow2.on .dchk{background:var(--ok);border-color:var(--ok)}
.drow2 .dmid{flex:1}
.caflag{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--hair);background:var(--hair-2);border-radius:999px;padding:1px 8px}
.drow2 .dstat{flex:0 0 auto;color:var(--ink-3)}
.drow2.on .dstat{color:var(--ok)}

.agdoc{border:1px solid var(--hair);border-radius:16px;padding:18px 18px 6px}
.agline{display:flex;gap:12px;padding:0 0 12px;align-items:baseline}
.agline.sub{padding-top:0;margin-top:-6px}
.agk{flex:0 0 118px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3)}
.agv{flex:1;font-size:13.5px;line-height:19px;color:var(--ink)}
.agstep{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair)}
.agstep .dchk{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--hair);display:grid;place-items:center;color:#fff}
.agstep.on .dchk{background:var(--ok);border-color:var(--ok)}
.agstep .dmid{flex:1}
.agstep .wbtn{flex:0 0 auto}

.howrap{padding:2px 2px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start}
.hocard{border:1px solid var(--hair);border-left:3px solid var(--ink);border-radius:14px;padding:18px 20px}
.horow{display:flex;align-items:center;justify-content:space-between}
.hoid{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--ink-3)}
.honote{margin-top:14px;padding:12px 14px;background:var(--hair-2);border-radius:12px}

.hocard.claimed{border-left-color:var(--ok);background:var(--hair-2)}
.ownbar{display:flex;align-items:center;gap:9px;margin-top:14px;padding:11px 14px;border:1px solid #CFE6DC;background:#F1F8F4;border-radius:12px}

.chd.out{color:var(--ink-2)}
.chca{font-style:normal;font-size:9.5px;font-weight:600;letter-spacing:.6px;background:var(--warn-soft);color:var(--warn);padding:2px 5px;border-radius:4px;margin-left:auto}
.chact{display:flex;align-items:center;gap:10px;padding-top:6px}

.winbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:var(--ok-soft);border:1px solid #CFE6DC;color:var(--ink)}
.winbar .s{color:var(--ink-2)}.winbar b{color:var(--ok)}
.wdot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pls 1.8s infinite}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.25}}
.fl2{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair-2)}
.fl2 .mid{flex:1}

.nav.two{grid-template-columns:repeat(2,1fr)}
.certdoc{border:1px solid var(--hair);border-radius:12px;padding:18px}
.certdoc .k{margin-bottom:14px}
.cline{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--hair-2);font-size:13px}
.cline:last-child{border-bottom:0}
.cline span{color:var(--ink-2)}
.ndot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hot);vertical-align:middle;margin-left:5px}

.vcard{margin:0 26px 12px;padding:16px;border:1px solid var(--hair);border-radius:12px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lgb{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--hair);border-radius:11px;background:var(--paper);cursor:pointer;font-family:inherit;color:var(--ink)}
.lgb:hover{border-color:var(--brand);background:var(--brand-soft)}
.lgb .s{line-height:1.4}

.ownsplit{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.ownbig{padding:20px;border:1px solid var(--hair);border-radius:13px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.obn{font:300 30px/1.1 'Inter';letter-spacing:-1.2px;font-variant-numeric:tabular-nums}
.obn.hot{color:var(--hot)}.obn.ok{color:var(--ok)}
.nwrap{position:relative}
.npanel{position:absolute;right:0;top:42px;width:330px;background:var(--paper);border:1px solid var(--hair);border-radius:12px;box-shadow:0 18px 44px rgba(11,26,51,.16);z-index:60;overflow:hidden}
.nhead{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--hair)}
.nrow{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--hair-2)}
.nk{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--ink-3)}
.nk.hot{background:var(--hot)}.nk.warn{background:var(--warn)}.nk.ok{background:var(--ok)}
.nb{display:flex;flex-direction:column;gap:2px}.nb b{font:500 13px/1.35 'Inter'}
.nw{color:var(--ink-3);margin-top:2px}
.bfhead{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.bfid{flex:1}
.bfgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px}
.thread{display:flex;flex-direction:column-reverse;gap:10px;max-height:280px;overflow-y:auto;margin:10px 0 12px}
.msg{padding:11px 14px;border-radius:11px;max-width:88%}
.msg p{font-size:13px;line-height:1.5}
.msg.buyer{background:var(--hair-2);border:1px solid var(--hair);align-self:flex-start}
.msg.office{background:var(--brand-soft);border:1px solid #C9D9FB;align-self:flex-end}
.msg .s{display:block;margin-top:5px;color:var(--ink-3)}
.reply{display:flex;gap:8px}
.reply .fi{flex:1}
@media(max-width:1000px){.ownsplit,.bfgrid{grid-template-columns:1fr}}

/* ---- polish pass ---- */
*:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:5px}
button:not(:disabled){transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
button:not(:disabled):active{transform:translateY(1px)}
.wbtn:disabled,button:disabled{opacity:.42;cursor:not-allowed}
::selection{background:var(--brand-soft);color:var(--brand-dk)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--hair);border-radius:6px;border:3px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
.wl,.tdbox,.ownbig,.insight,.hocard,.vcard,.certdoc{box-shadow:0 1px 2px rgba(11,26,51,.04)}
.tdcard,.lgb{box-shadow:0 1px 2px rgba(11,26,51,.04)}
.chip{border:1px solid transparent}
.chip.late{border-color:#F6CFCF}.chip.warn{border-color:#F3DDB4}.chip.wait{border-color:#C9D9FB}
.item,.sbtn,.dest{transition:background .15s}
.item:hover{background:var(--hair-2)}
.sbtn:hover:not([aria-selected="true"]){background:var(--hair-2)}
.mega,.obn,.tdn,.sumn,.kpin,.tdbig{font-feature-settings:'tnum' 1,'ss01' 1}
img{background:var(--hair-2)}
@media print{
 .bar,.side,.topbar,.nav,.tools,.docbar{display:none!important}
 body{background:#fff;padding:0}
 .desk,.wl,.tdbox{border:0;box-shadow:none}
 .docpaper{box-shadow:none;max-height:none;width:100%}
 .docmodal{position:static;background:none;padding:0;display:block}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

 if(n===0){ // foundation: trench and footing
  g+=`<rect x="${X-w*.03}" y="${HZ-h*.02}" width="${W+w*.06}" height="${h*.16}" fill="${dirt}"/>`;
  g+=slab(HZ+h*.06,h*.05,conc)+rebar(HZ-h*.06,7);
  g+=`<rect x="${X-w*.05}" y="${HZ+h*.20}" width="${w*.10}" height="${h*.05}" fill="${dirt}"/>`;
 } else if(n===1){ // plinth: filled base
  g+=slab(HZ-h*.06,h*.09,conc)+slab(HZ+h*.03,h*.03,conc2);
  g+=rebar(HZ-h*.16,8);
 } else if(n===2){ // ground slab
  g+=slab(HZ-h*.08,h*.11,conc)+floors(1)+crane;
 } else if(n===3){ // first slab
  g+=slab(HZ-h*.08,h*.11,conc)+floors(2)+crane;
 } else if(n===4){ // second slab, frame up
  g+=slab(HZ-h*.08,h*.11,conc)+floors(3)+crane;
 } else if(n===5){ // brickwork
  g+=slab(HZ-h*.08,h*.11,conc)+floors(3,brick);
  for(let r=0;r<10;r++)g+=`<rect x="${X+w*.05}" y="${HZ-h*.20-r*h*.032}" width="${W-w*.1}" height="1" fill="${brick2}" opacity=".55"/>`;
 } else if(n===6){ // plaster
  g+=slab(HZ-h*.08,h*.11,conc)+floors(3,conc);
  g+=`<rect x="${X+w*.03}" y="${HZ-h*.50}" width="${W-w*.06}" height="${h*.40}" fill="${conc}" opacity=".85"/>`;
 } else if(n===7){ // paint and openings
  g+=slab(HZ-h*.08,h*.11,conc)+floors(3,paint);
  for(let i=0;i<3;i++)for(let j=0;j<2;j++)
    g+=`<rect x="${X+w*.10+j*W*.42}" y="${HZ-h*.44+i*h*.115}" width="${w*.14}" height="${h*.055}" fill="${glass}"/>`;
 } else if(n===8){ // finishes, glazed
  g+=slab(HZ-h*.08,h*.11,conc)+floors(3,paint);
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)
    g+=`<rect x="${X+w*.07+j*W*.30}" y="${HZ-h*.44+i*h*.115}" width="${w*.12}" height="${h*.06}" fill="${glass}"/>`;
  g+=`<rect x="${X+W/2-w*.04}" y="${HZ-h*.10}" width="${w*.08}" height="${h*.10}" fill="${dark}"/>`;
 } else { // handover: complete, landscaped
  g+=slab(HZ-h*.08,h*.11,conc)+floors(3,paint);
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)
    g+=`<rect x="${X+w*.07+j*W*.30}" y="${HZ-h*.44+i*h*.115}" width="${w*.12}" height="${h*.06}" fill="${glass}"/>`;
  g+=`<rect x="${X+W/2-w*.04}" y="${HZ-h*.10}" width="${w*.08}" height="${h*.10}" fill="${dark}"/>`;
  g+=`<circle cx="${w*.10}" cy="${HZ+h*.02}" r="${h*.07}" fill="#8FA07E"/><rect x="${w*.095}" y="${HZ+h*.02}" width="3" height="${h*.10}" fill="#7A6A55"/>`;
  g+=`<circle cx="${w*.90}" cy="${HZ+h*.04}" r="${h*.055}" fill="#8FA07E"/><rect x="${w*.895}" y="${HZ+h*.04}" width="3" height="${h*.08}" fill="#7A6A55"/>`;
 }
 g+=`<rect y="${h-2}" width="${w}" height="2" fill="rgba(0,0,0,.06)"/>`;
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">${g}</svg>`;
}

 <div class="wl" style="margin-top:34px">
  ${rows.map(r=>`<div class="wrow">
    <span class="id">${r.v.id}</span>
    <span class="mid"><p class="h2">${r.item} · ${r.v.buyer}</p>
      <p class="s">Plastering on this villa is ${r.days<7?'days away':'about '+r.days+' days away'}. After it starts the same change costs roughly double.</p></span>
    <span class="days"><b class="${r.days<7?'h':''}">${r.days}</b>days left</span>
    <span class="amt">${money(r.extra)}</span>
    <button class="wbtn st" data-dtoast="Reminder sent to ${r.v.buyer} on WhatsApp with the options and the cut-off date">Remind</button>
  </div>`).join('')}
 </div>
 <p class="b note">An unmade choice is not a neutral thing. It either becomes a change order at twice the price after plastering, which the buyer resents, or it stops that villa while everyone waits for an answer. The cut-off is the plastering date your own engineer already reports here, so nobody has to remember it.</p>`;
}

/* ----- evidence: BSA 2023 s.63 certificate over the photographs ----- */
function evidenceView(){
 const rows=[
  ['B-14','Blockwork','31 Aug 2026 11:04','12.8391, 77.7724','a3f19c4e8b2d…','Certified'],
  ['B-14','Blockwork','21 Aug 2026 09:38','12.8391, 77.7724','7d0c55ab1e93…','Certified'],
  ['A-07','First floor slab','2 Sep 2026 07:12','12.8402, 77.7710','ff21b9037cac…','Ready'],
  ['C-03','Plinth beam','29 Aug 2026 16:20','12.8377, 77.7739','4b8e6a12dd70…','Ready'],
  ['A-09','Ground floor slab','18 Aug 2026 10:55','12.8399, 77.7702','91cc3e77b405…','Queried by ICICI']];
 return `
 <p class="big" style="margin-top:22px">${rows.length} records</p>
 <p class="s">every photograph carries its hash, its device and its coordinates from the moment it was taken</p>
 <div class="wl" style="margin-top:34px">
  ${rows.map(r=>`<div class="wrow">
    <span class="id">${r[0]}</span>
    <span class="mid"><p class="h2">${r[1]}</p>
      <p class="s">${r[2]} · ${r[3]} · SHA-256 ${r[4]}</p></span>
    <span class="days"><b class="${r[5]==='Queried by ICICI'?'h':''}">${r[5]==='Certified'?'signed':r[5]==='Ready'?'ready':'queried'}</b>${r[5]==='Certified'?'s.63':'status'}</span>
    <span style="flex:0 0 108px"></span>
    <button class="wbtn ${r[5]==='Ready'?'solid':''} st" data-dtoast="${r[5]==='Certified'?'Opening the section 63 certificate for '+r[0]:'Certificate drafted for '+r[0]+'. Needs the device custodian and expert signatures.'}">${r[5]==='Certified'?'Open':'Generate'}</button>
  </div>`).join('')}
 </div>
 <p class="k" style="margin-top:44px">What the certificate carries</p>
 <div class="wl">
  ${[['Identity of the record','Which photographs, against which villa and which stage'],
     ['Manner of production','Captured in the field app, uploaded direct to storage, never re-encoded'],
     ['Particulars of the device','Handset model, app build, operating system, device fingerprint'],
     ['Hash value and function','SHA-256, computed at upload and never recomputed'],
     ['Signature, person in charge','The site engineer who captured it'],
     ['Signature, expert','Required by section 63(4). Named once per project.']].map(r=>`
   <div class="wrow"><span class="mid"><p class="h2">${r[0]}</p><p class="s">${r[1]}</p></span>
     <span style="flex:0 0 108px"></span><span style="flex:0 0 108px"></span></div>`).join('')}
 </div>
 <p class="b note">Photographs that persuade a buyer and photographs that are admissible are not the same thing. The second needs the hash disclosed and two signatures. Since every image here is hashed at upload and never touched again, the certificate is a print job rather than a project. No competitor found does this.</p>`;
}

/* ---------- render ---------- */

function countUp(){
 const el=document.querySelector('.ctr[data-to]');if(!el)return;
 try{if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;}catch(e){}
 const to=+el.dataset.to;if(!to)return;
 if(typeof requestAnimationFrame!=='function'||typeof performance==='undefined')return;
 const dur=620,t0=performance.now();
 const step=n=>{const p=Math.min(1,(n-t0)/dur);const e=1-Math.pow(1-p,3);
  el.textContent=cr(Math.round(to*e));if(p<1)requestAnimationFrame(step);};
 requestAnimationFrame(step);
}

function render(){
 const ob=document.getElementById('offbtn');
 if(ob){ob.textContent=S.offline?'Go online':'No signal';ob.setAttribute('aria-pressed',S.offline);}
 const wb=document.getElementById('widebtn');
 if(wb){wb.textContent=S.wide?'Phone view':'Desktop fit';wb.setAttribute('aria-pressed',S.wide);}
 const bl=document.getElementById('blogo'); if(bl&&!bl.innerHTML) bl.innerHTML=logo(22,true);
 stage.innerHTML=!S.signed?`<div class="desk auth">${signIn()}</div>`:S.role==='office'?`<div class="desk">${office()}</div>`:`<div class="phone ${S.wide?'wide':''}">${S.role==='buyer'?buyer():site()}</div>`;
 document.querySelectorAll('.role').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
 countUp();
}
function toast(m){const t=document.getElementById('toast');if(!t)return;
 t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}
function dtoast(m){const t=document.getElementById('dtoast');t.textContent=m;t.classList.add('on');
 clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000);}
document.addEventListener('input',e=>{const rp=e.target.closest('[data-reply]');if(rp){S.reply=rp.value;return;}
 const a=e.target.closest('[data-auth]');if(a){S[a.dataset.auth]=a.value;return;}
 const i=e.target.closest('[data-filt]');if(!i)return;S.q=i.value;render();
 const n=document.querySelector('[data-filt]');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}});
function netState(){const b=document.getElementById('offbar');if(!b)return;const off=S.offline||!navigator.onLine;b.classList.toggle('on',off);b.textContent=off?(S.queue.length?'No signal. '+S.queue.length+' item'+(S.queue.length===1?'':'s')+' saved on this phone, waiting to sync.':'No signal. Anything you capture is saved on this phone and sent when signal returns.'):'Back online. Syncing.';}
window.addEventListener('online',netState);window.addEventListener('offline',netState);netState();
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-role],[data-tab],[data-villa],[data-back],[data-photo],[data-ms],[data-submit],[data-otab],[data-toast],[data-mode],[data-pack],[data-dtoast],[data-pick],[data-jsub],[data-jback],[data-jbank],[data-jgo],[data-jdoc],[data-jsubmit],[data-agsign],[data-agreg],[data-pickup],[data-oview],[data-signin],[data-authbg],[data-demo],[data-wide],[data-offline],[data-sync],[data-send],[data-bulksend],[data-docopen],[data-docclose],[data-chase],[data-bfopen],[data-bfclose],[data-notif],[data-send-reply],[data-visit],[data-flag],[data-stab],[data-vack],[data-snag],[data-logopen],[data-logclose],[data-logadd],[data-certopen],[data-certclose],[data-certsign],[data-sort],[data-clearq]');
 if(!t)return;const d=t.dataset;
 if(d.jsub){S.jSub=d.jsub;render();return;}
 if(d.jback){S.jSub=null;render();return;}
 if(d.jbank){S.jBank=d.jbank;render();return;}
 if(d.jgo){S.jSub=d.jgo;render();return;}
 if(d.jdoc){S.jDone[d.jdoc]=!S.jDone[d.jdoc];render();return;}
 if(d.jsubmit){S.jSub=null;render();toast('File submitted. The bank has it now.');return;}
 if(d.agsign){S.agSigned=true;render();toast('Sent for e-signature. Both parties notified.');return;}
 if(d.agreg){S.agReg=true;render();toast('Registered. Agreement locked to the file.');return;}
 if(d.clearq){S.q='';render();return;}
 if(d.sort){if(S.sortk===d.sort){S.sortd=-S.sortd;}else{S.sortk=d.sort;S.sortd=-1;}render();return;}
 if(d.authbg){S.authBg=d.authbg;render();return;}
 if(d.signin){S.signed=true;S.role='office';S.oTab='today';render();return;}
 if(d.demo){S.signed=true;S.role=d.demo;S.oTab='today';render();return;}
 if(d.offline){S.offline=!S.offline;render();netState();dtoast(S.offline?'Signal lost. Capture still works.':'Signal back.');return;}
 if(d.sync){const n=S.queue.length;S.queue=[];render();netState();dtoast(n+' item'+(n===1?'':'s')+' synced. Head office can see them now.');return;}
 if(d.wide){S.wide=!S.wide;render();return;}
 if(d.oview){S.oView=d.oview;render();return;}
 if(d.bulksend){if(!S.sel.length)return;S.packV=VILLAS.find(v=>v.id===S.sel[0])||S.packV;S.oTab='packs';S.sendStep=1;S.sel=[];render();dtoast('Pack sent. Follow the status below.');return;}
 if(d.vack){S.visitAck[d.vack]=true;render();toast('Accepted. The buyer and the office have been told.');return;}
 if(d.snag){S.snags[d.snag]=true;render();toast('Photograph of the fix sent. The buyer signs it off.');return;}
 if(d.logopen){S.logOpen=d.logopen;render();return;}
 if(d.logclose){S.logOpen=null;render();return;}
 if(d.logadd){const [k,txt]=d.logadd.split('|');S.logAdd.unshift({k:k,t:txt,d:'Today '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' · '+ME_ENG.name});S.logOpen=null;render();toast('Logged.');return;}
 if(d.stab){S.sTab=d.stab;S.certOpen=null;render();return;}
 if(d.certopen){S.certOpen=d.certopen;render();return;}
 if(d.certclose){S.certOpen=null;render();return;}
 if(d.certsign){S.signed_certs[d.certsign]=true;S.certOpen=null;render();toast('Certificate signed and sent to the office. The pack can now go to the lender.');return;}
 if(d.visit){S.visit=d.visit;if(d.visit==='none')S.flags=[];render();
   toast(d.visit==='requested'?'Slot requested. The office will confirm.':d.visit==='open'?'Window open. Anything you flag now is stamped.':d.visit==='closed'?'Visit closed. Sent to the office.':'');return;}
 if(d.flag){const pool=[['Damp patch on the east wall','answered on site by Suresh'],['Window frame not square','sent to the office'],['Tile chipped near the entry','answered on site by Suresh'],['Switch box left open','sent to the office'],['Paint uneven above the door','sent to the office'],['Drain cover missing','sent to the office']];
   const n=pool[S.flags.length%pool.length];S.flags.push({t:n[0],st:n[1]});render();return;}
 if(d.notif){S.notifOpen=!S.notifOpen;S.notifRead=true;render();return;}
 if(d.bfopen){S.buyerFile=d.bfopen;S.oTab='buyerfile';render();return;}
 if(d.bfclose){S.oTab='chase';render();return;}
 if(t.dataset.sendReply){const id=t.dataset.sendReply;if(!S.reply.trim())return;
   S.threads[id]=[{who:'office',t:S.reply,w:'Just now'},...(S.threads[id]||[])];S.reply='';render();dtoast('Reply sent to his app and by WhatsApp.');return;}
 if(d.chase){S.chaseOpen=S.chaseOpen===d.chase?null:d.chase;render();return;}
 if(d.docopen!==undefined){S.docOpen=+d.docopen;render();return;}
 if(d.docclose){S.docOpen=null;render();return;}
 if(d.send){S.sendStep=Math.min(6,S.sendStep+1);render();dtoast(S.sendStep===1?'Pack sent. '+ (notSentGlobal().bank||'The bank')+' will acknowledge shortly.':'Status advanced.');return;}
 if(d.pickup){const now=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});S.picked[d.pickup]={by:S.me,at:'today '+now};render();dtoast(d.pickup+' is yours now. You are the point of contact. Buyer messaged, journey started.');return;}
 if(d.role){S.role=d.role;S.sScreen='list';S.tab='villa';S.oTab='today';S.sel=[];render();return;}
 if(d.tab){S.tab=d.tab;render();return;}
 if(d.otab){S.oTab=d.otab;S.sel=[];render();return;}
 if(d.villa){S.sVilla=d.villa;S.sScreen='villa';S.sMs=[];S.sPhotos=0;S.sMode='update';render();return;}
 if(d.back){S.sScreen='list';render();return;}
 if(d.mode){S.sMode=d.mode;render();return;}
 if(d.photo){if(S.offline){S.queue.push('Photograph · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' · GPS locked');}S.sPhotos=Math.min(6,S.sPhotos+1);render();return;}
 if(d.ms){S.sMs=S.sMs.includes(d.ms)?[]:[d.ms];render();return;}
 if(d.pack){S.sel=S.sel.includes(d.pack)?S.sel.filter(x=>x!==d.pack):[...S.sel,d.pack];render();return;}
 if(d.submit){const r=S.sMs.length,m=S.sMode;S.sScreen='list';render();
  toast(m==='flag'?'Delay reported. The buyer has been told.':r?'Sent. Demand raised, pack queued to the bank, tranche released.':'Photographs sent.');return;}
 if(d.pick){const[i,j]=d.pick.split(':').map(Number);BUYER.picks[i].chose=BUYER.picks[i].chose===j?null:j;
   if(BUYER.picks[i].chose!==null&&BUYER.picks[i].st.includes('Choose'))BUYER.picks[i].st='Awaiting your signature';
   render();return;}
 if(d.toast){toast(d.toast);return;}
 if(d.dtoast){dtoast(d.dtoast);return;}
});
render();
</script>
