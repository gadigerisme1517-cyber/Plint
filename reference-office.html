<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inbell — Admin Office</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap');
:root{--ground:#F8F9FB;--surface:#fff;--ink:#0C0D10;--grey:#71737A;--faint:#A6A8AF;--hair:#ECEDF0;--hair2:#F4F5F7;--accent:#2F6BFF;--accsoft:#EAF0FF;--btn:#0F1014;--green:#12855B;--greenbg:#E9F6EF;--amber:#B4530B;--amberbg:#FFF2E8;--red:#B42318;--redbg:#FEEDEC;--redsoft:#FDECEA;--disp:'Manrope',sans-serif;--body:'Inter',sans-serif;--sh:0 1px 2px rgba(12,13,16,.04),0 6px 18px rgba(12,13,16,.05);--sh2:0 14px 44px rgba(12,13,16,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;flex:none;background:var(--surface);border-right:1px solid var(--hair);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:16px 14px}
.brand{display:flex;align-items:flex-start;gap:10px;padding:6px 8px 16px}
.logo{width:26px;height:26px;position:relative;flex:none;margin-top:2px}.logo .ring{position:absolute;inset:0;border:5px solid var(--ink);border-radius:50%}.logo .dot{position:absolute;width:9px;height:9px;background:var(--accent);border-radius:50%;top:0;right:0}
.bname{font-family:var(--disp);font-weight:800;font-size:17px;line-height:1.1}
.bsub{font-size:10.5px;color:var(--faint);margin-top:1px}
.nav{flex:1;overflow-y:auto;margin-top:2px}
.nav::-webkit-scrollbar{width:0}
.grp{font-family:var(--disp);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:14px 10px 5px}
.item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;color:var(--grey);font-weight:500;font-size:13.5px;cursor:pointer;margin-bottom:1px;transition:background .12s,color .12s}
.item:hover{background:var(--hair2);color:var(--ink)}
.item.on{background:var(--accsoft);color:var(--accent);font-weight:600}
.item svg{width:17px;height:17px;flex:none;stroke:currentColor;stroke-width:1.7;fill:none}
.item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-family:var(--disp);font-weight:700;font-size:10.5px;background:var(--redsoft);color:var(--red);border-radius:20px;padding:1px 8px}
.urow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--hair);padding-top:12px;margin-top:6px}
.uav{width:32px;height:32px;border-radius:50%;background:var(--btn);color:#fff;font-family:var(--disp);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.uinfo{flex:1;min-width:0}.uinfo b{font-size:12.5px;font-weight:600;display:block}.uinfo span{font-size:10.5px;color:var(--faint)}
.sout{border:none;background:var(--hair2);color:var(--grey);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:13px}
/* main */
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:none}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.h1{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.02em}
.hsub{color:var(--grey);font-size:12.5px;margin-top:3px}
.hacts{display:flex;gap:8px}
.btn{border:1px solid var(--hair);background:#fff;border-radius:10px;padding:9px 15px;font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--hair2)}
.btn.dark{background:var(--btn);color:#fff;border-color:var(--btn)}.btn.dark:hover{opacity:.92}
.btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none}
/* hero */
.hero{background:var(--surface);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--sh);padding:22px 24px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.hero .eyebrow{font-size:11px;color:var(--grey);font-weight:600;margin-bottom:7px}
.hero .big{font-family:var(--disp);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1}
.hero .bigsub{color:var(--grey);font-size:12.5px;margin-top:9px}
.num{font-variant-numeric:tabular-nums}
.mini-r{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.mini-v{font-family:var(--disp);font-weight:800;font-size:25px;line-height:1}
.mini-v.g{color:var(--green)}
.bar{height:9px;background:var(--hair);border-radius:20px;overflow:hidden;margin-top:16px}
.bar span{display:block;height:100%;background:var(--green);border-radius:20px}
.barcap{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:11.5px;color:var(--grey)}
.barcap b{color:var(--ink)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--sh);padding:15px 16px}
.kpi .kl{font-size:11.5px;color:var(--grey);display:flex;align-items:center;gap:7px;margin-bottom:9px}
.kpi .kl svg{width:14px;height:14px;stroke:var(--faint);stroke-width:1.8;fill:none}
.kpi b{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.02em;display:block;line-height:1}
.kpi .kn{font-size:10.5px;color:var(--faint);margin-top:6px}
/* cards / grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.ch{padding:15px 18px 0;display:flex;align-items:center;justify-content:space-between}
.ct{font-family:var(--disp);font-weight:700;font-size:14px}
.cb{padding:8px 18px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair2)}
.row:last-child{border-bottom:none}
.rico{width:34px;height:34px;border-radius:9px;background:var(--hair2);display:flex;align-items:center;justify-content:center;flex:none}
.rico svg{width:16px;height:16px;stroke:var(--grey);stroke-width:1.8;fill:none}
.rt{flex:1;min-width:0}.rt b{font-weight:600;font-size:13px}.rt span{display:block;font-size:11.5px;color:var(--faint)}
.rr{font-family:var(--disp);font-weight:700;font-size:13px;flex:none}
/* filters + table */
.filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--hair);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;color:var(--grey);font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--btn);color:#fff;border-color:var(--btn);font-weight:600}
.tbl{background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.tr{display:grid;align-items:center;padding:12px 18px;border-bottom:1px solid var(--hair2);font-size:13px}
.tr:last-child{border-bottom:none}
.tr.hd{background:var(--ground);font-family:var(--disp);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--grey)}
.tr.click{cursor:pointer}.tr.click:hover{background:var(--hair2)}
.who b{font-weight:600}.who span{display:block;font-size:11px;color:var(--faint)}
.miniav{width:30px;height:30px;border-radius:50%;background:var(--hair);color:var(--grey);font-family:var(--disp);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.cellav{display:flex;align-items:center;gap:10px}
.pill{font-family:var(--disp);font-weight:700;font-size:10.5px;padding:3px 9px;border-radius:20px;display:inline-block}
.p-paid{background:var(--greenbg);color:var(--green)}
.p-due{background:var(--amberbg);color:var(--amber)}
.p-over{background:var(--redbg);color:var(--red)}
.p-accent{background:var(--accsoft);color:var(--accent)}
.p-grey{background:var(--hair2);color:var(--grey)}
/* pipeline */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--hair2);border-radius:14px;padding:11px;min-width:250px;width:250px;flex:none}
.colh{display:flex;align-items:center;gap:8px;padding:3px 5px 10px}
.colh .ctt{font-family:var(--disp);font-weight:700;font-size:12.5px}
.colh .cnt{font-family:var(--disp);font-weight:700;font-size:10.5px;background:#fff;color:var(--grey);border:1px solid var(--hair);border-radius:20px;padding:1px 7px}
.lcard{background:#fff;border:1px solid var(--hair);border-radius:12px;box-shadow:var(--sh);padding:11px 12px;margin-bottom:8px;cursor:pointer}
.lcard:hover{box-shadow:0 4px 14px rgba(12,13,16,.08)}
.lcard b{font-weight:600;font-size:13px}
.lcard .ls{font-size:11px;color:var(--faint);margin-top:1px}
.lcard .lt{margin-top:8px;display:flex;gap:6px}
/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--btn);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:all .2s;z-index:80}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:40px;text-align:center;color:var(--faint);font-size:13px}
.note{background:var(--accsoft);border:1px solid #D8E3FF;border-radius:12px;padding:12px 15px;font-size:12.5px;color:#274690;margin-bottom:14px}
/* mobile */
.ham{display:none}
.scrim2{display:none}
@media(max-width:860px){
  .side{position:fixed;left:0;top:0;z-index:70;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh2)}
  .side.open{transform:translateX(0)}
  .scrim2{display:block;position:fixed;inset:0;background:rgba(12,13,16,.3);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim2.on{opacity:1;pointer-events:auto}
  .topbar{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--hair);padding:12px 16px;position:sticky;top:0;z-index:30}
  .ham{display:flex;border:1px solid var(--hair);background:#fff;border-radius:9px;width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer}
  .ham svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2}
  .main{padding:18px 16px 60px}
  .hero,.kpis,.g2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="scrim2" id="scrim2" onclick="closeNav()"></div>
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><div class="ring"></div><div class="dot"></div></div>
      <div><div class="bname">Inbell</div><div class="bsub">Meridian Institute · ISME</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="urow">
      <div class="uav">MO</div>
      <div class="uinfo"><b>Meridian Office</b><span>office@isme.demo</span></div>
      <button class="sout" title="Sign out" onclick="toast('Signed out (demo)')">⇥</button>
    </div>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div class="topbar">
      <button class="ham" onclick="openNav()"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div style="display:flex;align-items:center;gap:8px"><div class="logo" style="width:20px;height:20px"><div class="ring" style="border-width:4px"></div><div class="dot" style="width:7px;height:7px"></div></div><b style="font-family:var(--disp);font-size:15px">Inbell</b></div>
    </div>
    <main class="main"><div id="screen"></div></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- icons ---------- */
const I = {
  home:'<path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/>',
  growth:'<path d="M4 19V5M4 19h16M8 15l3-4 3 3 4-6"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0M16 6a3 3 0 010 6M21 20a6 6 0 00-4-5.6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/>',
  money:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  attend:'<path d="M20 6L9 17l-5-5"/>',
  exam:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  comms:'<path d="M4 5h16v11H8l-4 4z"/>',
  report:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  event:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15h3"/>',
  bell:'<path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6M10 20a2 2 0 004 0"/>',
  hr:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0114 0"/>',
  cert:'<circle cx="12" cy="9" r="5"/><path d="M9 13l-1.5 7L12 18l4.5 2L15 13"/>',
  hostel:'<path d="M3 21V8l9-5 9 5v13M9 21v-6h6v6"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2 2M16.4 16.4l2 2M18.4 5.6l-2 2M7.6 16.4l-2 2"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  risk:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  cockpit:'<circle cx="12" cy="12" r="9"/><path d="M12 12l5-3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
};
const ic = (n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none">${I[n]||I.report}</svg>`;

/* ---------- nav (exact office structure) ---------- */
const NAV = [
  {item:{id:'dashboard',label:'Dashboard',icon:'home'}},
  {grp:'Money'},
  {item:{id:'crm',label:'Admissions CRM',icon:'growth',badge:9}},
  {item:{id:'fees',label:'Fees',icon:'money',badge:276}},
  {item:{id:'fee_structures',label:'Fee structures',icon:'money'}},
  {grp:'People'},
  {item:{id:'students',label:'Students',icon:'users'}},
  {item:{id:'batches',label:'Batches',icon:'cal'}},
  {item:{id:'attendance',label:'Attendance',icon:'attend'}},
  {item:{id:'leave',label:'Student leave',icon:'attend'}},
  {item:{id:'hr',label:'HR & Payroll',icon:'hr'}},
  {grp:'Academics'},
  {item:{id:'exams',label:'Exams',icon:'exam'}},
  {item:{id:'timetable',label:'Timetable',icon:'cal'}},
  {item:{id:'teaching',label:'Teaching assignments',icon:'users'}},
  {item:{id:'calendar',label:'Calendar',icon:'cal'}},
  {item:{id:'certs',label:'Certificates',icon:'cert'}},
  {grp:'Operations'},
  {item:{id:'comms',label:'Communication',icon:'comms'}},
  {item:{id:'comms_history',label:'Broadcast history',icon:'report'}},
  {item:{id:'events',label:'Events',icon:'event'}},
  {item:{id:'notices',label:'Notices',icon:'bell'}},
  {item:{id:'hostel',label:'Hostel',icon:'hostel'}},
  {item:{id:'library',label:'Library',icon:'report'}},
  {item:{id:'placements',label:'Placements',icon:'growth'}},
  {item:{id:'ops',label:'Operations',icon:'settings'}},
  {grp:'Setup'},
  {item:{id:'setup',label:'Set up college',icon:'settings'}},
  {item:{id:'onboarding',label:'Onboarding',icon:'growth'}},
  {item:{id:'logins',label:'Logins',icon:'users'}},
  {item:{id:'corrections',label:'Corrections',icon:'settings'}},
  {item:{id:'settings',label:'Settings',icon:'settings'}},
  {item:{id:'adm_help',label:'Help',icon:'bolt'}},
];
let current='dashboard';
function renderNav(){
  const n=document.getElementById('nav');
  n.innerHTML=NAV.map(e=>{
    if(e.grp) return `<div class="grp">${e.grp}</div>`;
    const it=e.item;
    return `<div class="item ${it.id===current?'on':''}" onclick="go('${it.id}')">${ic(it.icon)}<span class="lbl">${it.label}</span>${it.badge?`<span class="badge">${it.badge}</span>`:''}</div>`;
  }).join('');
}
function go(id){ current=id; renderNav(); const s=SCREENS[id]||SCREENS._todo; document.getElementById('screen').innerHTML=s(id); document.getElementById('main')?.scrollTo?.(0,0); window.scrollTo(0,0); closeNav(); }
function openNav(){document.getElementById('side').classList.add('open');document.getElementById('scrim2').classList.add('on');}
function closeNav(){document.getElementById('side').classList.remove('open');document.getElementById('scrim2').classList.remove('on');}

/* ---------- helpers ---------- */
const head=(t,s,acts='')=>`<div class="head"><div><div class="h1">${t}</div>${s?`<div class="hsub">${s}</div>`:''}</div>${acts?`<div class="hacts">${acts}</div>`:''}</div>`;
const kpis=(arr)=>`<div class="kpis">${arr.map(k=>`<div class="kpi"><div class="kl">${ic(k.icon)} ${k.l}</div><b>${k.v}</b><div class="kn">${k.n}</div></div>`).join('')}</div>`;
const filterbar=(id,opts)=>`<div class="filters" id="f_${id}">${opts.map((o,i)=>`<div class="chip ${i===0?'on':''}" onclick="pickChip(this)">${o}</div>`).join('')}</div>`;
function pickChip(el){[...el.parentNode.children].forEach(c=>c.classList.remove('on'));el.classList.add('on');}
const initials=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
function table(cols,rows,tmpl,onclick){
  const gt=`grid-template-columns:${tmpl}`;
  let h=`<div class="tbl"><div class="tr hd" style="${gt}">${cols.map(c=>`<div>${c}</div>`).join('')}</div>`;
  rows.forEach((r,i)=>{ h+=`<div class="tr ${onclick?'click':''}" style="${gt}" ${onclick?`onclick="${onclick}(${i})"`:''}>${r.map(c=>`<div>${c}</div>`).join('')}</div>`; });
  return h+'</div>';
}
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1900);}

/* ---------- sample data ---------- */
const STUD=[['Ishaan Bose','MBA · 2024/1190','MBA','Paid'],['Arjun Kumar','MBA · 2024/1204','MBA','Overdue'],['Sneha Patel','BBA · 2025/1211','BBA','Overdue'],['Diya Bhat','B.Com · 2026/0002','B.Com','Paid'],['Rahul Nair','B.Com · 2024/1266','B.Com','Overdue'],['Ananya Sharma','B.Sc · 2026/0011','B.Sc','Paid'],['Vikram Jain','MBA · 2024/1251','MBA','Due'],['Meera Kutty','MBA · 2024/1280','MBA','Paid'],['Dev Rao','BCA · 2024/1219','BCA','Paid'],['Priya Nanda','B.Sc · 2025/1244','B.Sc','Due']];
const stPill=s=>s==='Paid'?'<span class="pill p-paid">Paid</span>':s==='Overdue'?'<span class="pill p-over">Overdue</span>':'<span class="pill p-due">Due</span>';

/* ---------- SCREENS ---------- */
const SCREENS={};

SCREENS.dashboard=()=>head('Office dashboard','Your engine room — what needs doing today.',
  `<button class="btn" onclick="go('crm')">${ic('plus')} New lead</button><button class="btn dark" onclick="go('fees')">${ic('money')} Collect fee</button>`)
+`<div class="hero">
  <div><div class="eyebrow">Fees to collect</div><div class="big num">₹41.8<small style="font-size:20px;color:var(--faint)">L</small></div><div class="bigsub">275 students are past due · 341 in all carry a balance</div></div>
  <div>
    <div class="mini-r"><div><div class="eyebrow">Collected</div><div class="mini-v g num">₹3.07 Cr</div></div><div style="text-align:right"><div class="eyebrow">Still outstanding</div><div class="mini-v num">₹41.8L</div></div></div>
    <div class="bar"><span style="width:88%"></span></div>
    <div class="barcap"><span><b>88%</b> of billed fees are in</span><span style="color:var(--faint)">₹3.49 Cr billed this year</span></div>
  </div>
</div>`
+kpis([{l:'Overdue',icon:'risk',v:'275',n:'past the due date'},{l:'Open leads',icon:'growth',v:'9',n:'in the pipeline'},{l:'Attendance today',icon:'attend',v:'11',n:'of 12 sections marked'},{l:'Past due',icon:'users',v:'275',n:'students with a missed date'}])
+`<div class="g2">
  <div class="card"><div class="ch"><div class="ct">Today's tasks</div></div><div class="cb">
    ${[['Call 275 fee defaulters','₹41.8L past due','fees'],['Follow up 9 open leads','nothing should sit still in the pipeline','crm'],['Mark attendance — 1 section left','B.Sc · Sem 2 not marked','attendance'],['Approve 3 leave requests','2 medical, 1 casual','leave']].map(t=>`<div class="row"><div class="rico">${ic('bolt')}</div><div class="rt"><b>${t[0]}</b><span>${t[1]}</span></div><button class="btn" onclick="go('${t[2]}')">Open</button></div>`).join('')}
  </div></div>
