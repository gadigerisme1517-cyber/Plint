# Render blueprint. Free tier.
#
# One web service and one Postgres. No disk: persistent disks are a paid
# feature on Render, so PLINT_EVIDENCE_DIR points at the container's own
# filesystem and uploaded photographs do not survive a restart. That is a real
# limitation, not an oversight - see DECISIONS.md and docs/DEPLOY.md.
#
# Secrets are declared with sync:false, which means Render prompts for them
# once in its dashboard and stores them there. None of them is in this file
# and none of them belongs in this repository.

services:
  - type: web
    name: plint
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # nearest to the project this demo describes
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # The database, wired by Render from the instance below. This is the
      # OWNING role; the runtime role is created from it by db/bootstrap.js.
      - key: DATABASE_URL
        fromDatabase:
          name: plint-db
          property: connectionString

      # The runtime role. Not the owner, so row-level security binds it, which
      # since migration 010 is the entire isolation boundary.
      - key: PGUSER
        value: plint_app
      - key: PGPASSWORD
        generateValue: true

      - key: PLINT_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production
      - key: PGSSLMODE
        value: require

      # Render terminates TLS and forwards the client address, so the login
      # rate limiter should count the caller and not the proxy.
      - key: PLINT_TRUST_PROXY
        value: "1"

      # Demo data: the three logins the README lists. Seeds once, on an empty
      # database, and skips thereafter.
      - key: PLINT_SEED_DEMO
        value: "1"

      # No disk on the free plan. This is inside the container and is lost on
      # every deploy, restart and cold start.
      - key: PLINT_EVIDENCE_DIR
        value: /tmp/plint-evidence

databases:
  - name: plint-db
    plan: free
    databaseName: plint
    user: plint_owner
