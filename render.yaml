# Render blueprint. Free tier. Compute only.
#
# The database is Supabase, not Render, so there is no `databases:` block here
# and DATABASE_URL is supplied as a secret in Render's dashboard. See
# docs/DEPLOY.md for which string to paste and where to find it.
#
# Render's free plan has no persistent disk, so PLINT_EVIDENCE_DIR points at
# the container's own filesystem and uploaded photographs do not survive a
# restart. That is a real limitation, not an oversight - docs/DEPLOY.md says
# what it looks like during a demo.

services:
  - type: web
    name: plint
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # nearest to the project this demo describes
    healthCheckPath: /health
    # On, so this file does not say the opposite of how the service behaves.
    # It was `false` with no reason recorded anywhere, which is its own small
    # bug - but note that it was never in effect: the service was created from
    # the dashboard rather than synced from this blueprint, and pushes have
    # always deployed on their own.
    #
    # A free-plan Docker build takes six to thirteen minutes. A URL checked a
    # minute after a push looks exactly like a URL that is not deploying at
    # all. It is not. Wait, or read the dashboard.
    autoDeploy: true
    envVars:
      # Supabase, pasted once into Render's dashboard. sync:false means Render
      # prompts for it and stores it there; it is never in this repository.
      #
      # Use the SESSION POOLER string, not the direct connection: Supabase's
      # direct endpoint is IPv6-only on new projects and Render's free egress
      # is IPv4. This is the OWNING role - db/bootstrap.js creates the runtime
      # role from it.
      - key: DATABASE_URL
        sync: false

      # The runtime role's password. The username is NOT set here: it is
      # derived from DATABASE_URL, keeping whatever pooler suffix the owner
      # carries, because getting that by hand wrong produces an app that
      # connects and then sees nothing.
      - key: PGPASSWORD
        generateValue: true

      - key: PLINT_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production
      - key: PGSSLMODE
        value: require

      # Render terminates TLS and forwards the client address, so the login
      # rate limiter should count the caller and not the proxy.
      - key: PLINT_TRUST_PROXY
        value: "1"

      # Demo data: the logins the README lists. Seeds once, on an empty
      # database, and skips thereafter.
      - key: PLINT_SEED_DEMO
        value: "1"

      # No disk on the free plan. Inside the container, lost on every deploy,
      # restart and cold start.
      - key: PLINT_EVIDENCE_DIR
        value: /tmp/plint-evidence
